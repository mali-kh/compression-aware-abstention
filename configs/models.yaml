# Model choices. v1 picks one base model; we do not multi-model in week 1.
# Llama-3.1-8B is the default reference because KVzip's paper uses Llama-family
# checkpoints and the A10's 23GB fits 8B in bf16 with room for KV cache.
default: llama3_8b_instruct

llama3_8b_instruct:
  hf_id: meta-llama/Meta-Llama-3.1-8B-Instruct
  dtype: bfloat16
  attn_impl: flash_attention_2  # falls back to sdpa if flash-attn missing

# Smaller fallback for offline iteration / CI smoke tests.
qwen2_5_1_5b:
  hf_id: Qwen/Qwen2.5-1.5B-Instruct
  dtype: bfloat16
  attn_impl: sdpa
